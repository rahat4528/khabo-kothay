<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E40"/>
      <stop offset="50%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="#2B2825" stroke-width="4"/>

  <!-- Main Dining Pin Mark -->
  <g filter="url(#shadow)">
    <!-- Outer Geolocation Pin -->
    <path d="M 512 840 C 470 770 300 550 300 400 C 300 256 395 150 512 150 C 629 150 724 256 724 400 C 724 550 554 770 512 840 Z" fill="url(#pinGrad)"/>
    
    <!-- Inner Pure White Pin Aperture -->
    <circle cx="512" cy="400" r="170" fill="#FFFFFF"/>

    <!-- Cloche Serving Dome -->
    <path d="M 416 460 C 416 385 455 330 512 330 C 569 330 608 385 608 460 Z" fill="#FF5722"/>
    <!-- Cloche Handle / Knob -->
    <circle cx="512" cy="316" r="16" fill="#FF5722"/>
    <!-- Platter Serving Tray Base -->
    <rect x="390" y="468" width="244" height="18" rx="9" fill="#1E1C1A"/>
    <!-- Platter Rim Highlight -->
    <rect x="410" y="472" width="204" height="6" rx="3" fill="#FF6E40"/>
    
    <!-- Warm Aroma Steam Curves -->
    <path d="M 470 292 C 462 274 466 256 476 242" fill="none" stroke="#FF6E40" stroke-width="8" stroke-linecap="round"/>
    <path d="M 512 284 C 504 266 508 248 518 232" fill="none" stroke="#FF5722" stroke-width="9" stroke-linecap="round"/>
    <path d="M 554 292 C 546 274 550 256 560 242" fill="none" stroke="#FF6E40" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
